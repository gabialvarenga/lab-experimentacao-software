name: lab03-testes

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab03/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest --cov=metricas --cov-report=term-missing --cov-fail-under=80
