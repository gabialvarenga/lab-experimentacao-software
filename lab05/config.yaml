# Configuração do Lab05. Não há segredos aqui: o Lab05 não usa token.
# Protocolo de cada execução: docs/protocolo-execucao.md. Os caminhos valem a partir desta pasta.

semente: 42   # semente global: ordem aleatorizada das execuções e reamostragens (bootstrap)

# Plano de execuções (S01-07). Uma execução = (servidor, io_threads, carga, repetição).
# Cada repetição é um bloco com uma execução de cada combinação, em ordem sorteada com a semente.
plano:
  servidores:                 # nome no CSV -> serviço do compose.yaml, CLI e campo da versão no INFO
    redis:
      servico: redis
      cli: redis-cli
      campo_versao: redis_version
      versao_esperada: "8.10.3"     # a validação (S01-08) recusa outra versão
    valkey:
      servico: valkey
      cli: valkey-cli
      campo_versao: valkey_version   # o Valkey também traz redis_version:7.2.4, por compatibilidade
      versao_esperada: "9.1.3"
  io_threads: [1, 4]
  cargas:                     # carga -> --ratio do memtier_benchmark (SET:GET)
    set: "1:0"
    get: "0:1"
    misto: "1:4"
  repeticoes: 40              # fixado pelo piloto (S01-09, docs/analise-piloto.md): 480 execuções, ~8 h

# Cliente de carga: memtier_benchmark 2.6.1 (protocolo, seções 4 a 6). Tempos em segundos.
cliente:
  threads: 4
  clientes_por_thread: 12     # 48 clientes no total
  tamanho_valor: 100          # bytes
  pipeline: 1
  chaves: 100000              # pré-carga de 1 a 100.000 antes de toda carga
  aquecimento_s: 10           # proposta; saída descartada
  medicao_s: 30               # proposta
  pausa_s: 5                  # entre uma execução e a próxima
  limite_subida_s: 120        # tempo máximo para o servidor ficar pronto

# Saídas do executor: <nome>.csv, falhas.csv, saidas/<execucao_id>.json e registro-<nome>.md
# (sem nome: execucoes.csv e registro-<data>.md)
saida: dados/brutos

# Coleta piloto (S01-08): `python -m lab05 executar --piloto` troca estes valores.
# O piloto não entra na análise final.
piloto:
  repeticoes: 5
  saida: dados/piloto
  nome: piloto

# Análise (S01-09): `python -m lab05 analisar [--piloto]` grava em <saida>/analise/.
# Regras em docs/plano-analise.md; motor de poder adaptado do Lab04 (lab05/poder.py).
analise:
  diferenca_relevante: 0.05   # razão de medianas fora de [0,95; 1,05] (plano, seção 6)
  alfa: 0.05                  # bicaudal, com Holm dentro de cada pergunta (6 comparações)
  bootstrap: 10000            # reamostragens do IC da razão de medianas
  poder: 0.80
  simulacoes: 2000            # repetições simuladas por ponto da curva de poder
  cenario_holm: conservador   # só a comparação avaliada tem o efeito (pior caso de Holm)
  grade_n: [5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 60, 70, 80, 100, 120, 150, 200, 250, 300]
  candidatos_n: [30, 40, 45, 50, 60]   # n perto do viável na S02 (8 a 10 h de máquina): diferença detectável em cada um
  diferencas: [0.05, 0.06, 0.07, 0.08, 0.09, 0.10, 0.11, 0.12, 0.13, 0.14, 0.15, 0.16, 0.17, 0.18, 0.19, 0.20]
  # Decisões tomadas uma vez no piloto e fixas para a coleta completa (plano de análise, seção 9):
  # o `analisar` usa estes valores e só registra o que a regra 5.1 daria nos dados analisados.
  teste_principal:            # Q1, Q2 e Q4: adendo de 19/11/2026
    ops_s: mann_whitney
    lat_p50_ms: mann_whitney
    lat_p99_ms: mann_whitney
    memoria_bytes: mann_whitney
  metodo_q3:                  # Q3: adendo de 23/11/2026
    ops_s: art
    lat_p99_ms: art
